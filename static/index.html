<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Data Agent · 问数工作台</title>
    <style>
      :root {
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        color: #182c40;
        background: #f1f4f7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      header {
        padding: 25px 5%;
        background: #142e42;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h1 {
        font-size: 23px;
        margin: 0;
      }
      header p {
        color: #aec5d5;
        font-size: 13px;
        margin-bottom: 0;
      }
      .badge {
        background: #315466;
        border: 1px solid #507384;
        border-radius: 18px;
        padding: 8px 14px;
        font-size: 12px;
      }
      main {
        max-width: 1350px;
        margin: 26px auto;
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 22px;
        padding: 0 22px;
      }
      aside,
      .card {
        background: white;
        border: 1px solid #dbe3e9;
        border-radius: 12px;
        padding: 22px;
        box-shadow: 0 4px 15px #142e4205;
      }
      aside {
        align-self: start;
      }
      h2 {
        font-size: 16px;
        margin-top: 0;
      }
      p,
      li {
        font-size: 14px;
        line-height: 1.8;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid #cddbe3;
        border-radius: 7px;
        padding: 10px 14px;
        background: #fff;
        color: #244b64;
      }
      button:hover {
        background: #edf7fa;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .examples button {
        display: block;
        width: 100%;
        text-align: left;
        margin: 10px 0;
        font-size: 13px;
        line-height: 1.6;
      }
      .primary {
        background: #147d92;
        color: #fff;
        border: 0;
      }
      .primary:hover {
        background: #106c7f;
      }
      textarea,
      input {
        font: inherit;
        width: 100%;
        border: 1px solid #cddbe3;
        border-radius: 8px;
        padding: 12px;
        resize: vertical;
      }
      textarea {
        min-height: 100px;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 12px;
      }
      .muted {
        color: #668093;
        font-size: 12px;
      }
      .card {
        margin-bottom: 18px;
      }
      .trace {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .trace span {
        border-radius: 4px;
        padding: 5px 8px;
        background: #edf3f6;
        font-size: 11px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      td,
      th {
        padding: 9px 12px;
        text-align: left;
        border-bottom: 1px solid #e4ebef;
      }
      th {
        background: #f3f7fa;
      }
      .scroll {
        overflow: auto;
        max-height: 420px;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #f2f5f8;
        padding: 15px;
        font-size: 12px;
        max-height: 350px;
        overflow: auto;
      }
      details {
        margin-top: 15px;
      }
      summary {
        cursor: pointer;
        font-size: 13px;
        color: #35607c;
      }
      .warning {
        background: #fff6df;
        padding: 12px;
        border-radius: 6px;
        font-size: 13px;
      }
      .error {
        color: #a43b3b;
      }
      .chart svg {
        width: 100%;
        height: auto;
      }
      #output:empty {
        display: none;
      }
      @media (max-width: 800px) {
        main {
          grid-template-columns: 1fr;
        }
        aside {
          order: 2;
        }
        .badge {
          max-width: 180px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>
          Data Agent
          <span style="font-weight: 400; color: #9abaca">/ 问数工作台</span>
        </h1>
        <p>指标口径 · 受控查询 · 连续分析 · 证据追溯</p>
      </div>
      <span id="mode" class="badge">检查运行状态…</span>
    </header>
    <main>
      <aside>
        <h2>试着从一个问题开始</h2>
        <div class="examples">
          <button>上个月各渠道的成功激活人数</button>
          <button>上个月每天各渠道的注册人数，画趋势图</button>
          <button>上个月信息流渠道的激活成本</button>
          <button>2026-09-01 至 2026-09-20 的 D7 留存率</button>
          <button>上个月各渠道的新增用户数</button>
        </div>
        <hr style="border: 0; border-top: 1px solid #e4ebef; margin: 22px 0" />
        <h2>连续追问</h2>
        <p class="muted">
          完成首个查询后，可继续输入“画柱状图”“只看渠道A”“再按操作系统拆开”。结果不够用时会重新查询。
        </p>
        <p class="muted">
          演示日期：2026-09-22
          <br />
          模拟数据完整至：2026-09-20
          <br />
          结果缓存有效期：1 小时
        </p>
        <details>
          <summary>访问令牌（如已启用）</summary>
          <input
            id="token"
            type="password"
            autocomplete="off"
            placeholder="仅保存在当前页面内存"
          />
        </details>
        <details>
          <summary>已登记指标口径</summary>
          <div id="catalog"></div>
        </details>
        <hr />
        <h2>长期记忆</h2>
        <p class="muted">
          主动保存字段、表或结果；勾选后用于本次提问。过期结果会重新查询。
        </p>
        <select id="memory-kind" aria-label="记忆类型">
          <option value="field">字段</option>
          <option value="table">表</option>
        </select>
        <input
          id="memory-source"
          aria-label="表或字段"
          placeholder="users.user_id 或 users"
        />
        <input
          id="memory-note"
          aria-label="记忆说明"
          placeholder="选填：说明或使用偏好"
        />
        <button id="save-schema">保存到记忆</button>
        <input
          id="memory-search"
          aria-label="搜索记忆"
          placeholder="搜索已保存记忆"
        />
        <div id="memories"></div>
      </aside>
      <section>
        <div class="card">
          <h2 id="prompt-title">向数据提问</h2>
          <textarea
            id="question"
            aria-label="分析问题"
            placeholder="例如：上个月各渠道的成功激活人数"
          ></textarea>
          <div class="toolbar">
            <button class="primary" id="send">开始分析</button>
            <button id="new">新建会话</button>
            <span id="status" class="muted">结果保留来源 SQL 与完整口径</span>
          </div>
        </div>
        <div id="output"></div>
      </section>
    </main>
    <script>
      // 页面状态：当前会话、等待澄清的任务，以及提交中的标记。
      let session = null,
        pending = null,
        busy = false;
      // 勾选记忆后才把 ID 随请求发送；新建会话时可继续选用。
      const selectedMemories = new Set();
      const $ = (id) => document.getElementById(id);
      // 输出到 HTML 前转义用户文本和模型返回内容。
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      // 统一处理 JSON 请求、可选访问令牌与接口错误。
      async function api(url, body, method) {
        const r = await fetch(url, {
          method: method || (body ? "POST" : "GET"),
          headers: {
            "Content-Type": "application/json",
            ...($("token").value
              ? { Authorization: "Bearer " + $("token").value }
              : {}),
          },
          ...(body ? { body: JSON.stringify(body) } : {}),
        });
        if (!r.ok) throw new Error(JSON.stringify((await r.json()).detail));
        return r.json();
      }
      // 渲染一轮任务的结果、执行轨迹、SQL 证据和检索信息。
      function render(t) {
        session = t.session_id;
        sessionStorage.setItem("data-agent-last-task", t.id);
        pending = t.state === "NEEDS_CLARIFICATION" ? t : null;
        $("prompt-title").textContent = pending
          ? "请补充口径"
          : "继续追问或提出新问题";
        let html = `<div class="card"><h2>${esc(t.question)}</h2><div class="trace">${t.trace.map((x) => `<span title="${esc(x.note)}">${esc(x.state)}</span>`).join("")}</div><p class="muted">${esc(t.mode)} · ${t.elapsed_ms} ms · 任务 ${esc(t.id.slice(0, 8))}</p>`;
        if (pending) html += `<p class="warning">${esc(t.clarification)}</p>`;
        if (t.error) html += `<p class="error">${esc(t.error.message)}</p>`;
        if (t.report) {
          html += `<p>${esc(t.report.text)}</p><p class="muted">口径：${esc(t.report.metric_definition)}</p>`;
          if (t.reuse)
            html += `<p class="muted">${t.reuse.reused ? "复用" : "查询"}：${esc(t.reuse.reason)}</p>`;
          for (const w of t.report.warnings)
            html += `<p class="warning">${esc(w)}</p>`;
          if (t.report.chart_svg) {
            const uri = URL.createObjectURL(
              new Blob([t.report.chart_svg], { type: "image/svg+xml" }),
            );
            html += `<img class="chart-image" style="width:100%" src="${uri}" alt="指标图表">`;
          }
          const r = t.result;
          html += `<div class="scroll"><table><thead><tr>${r.columns.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${r.rows.map((row) => `<tr>${r.columns.map((c) => `<td>${esc(row[c] === null ? "—" : typeof row[c] === "number" ? Number(row[c].toFixed(4)) : row[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
          if (r.preview_truncated)
            html += `<p class="muted">表格仅展示前 200 行，分析使用完整结果（${r.total_rows} 行）。</p>`;
          html += `<details><summary>查询契约与来源 SQL</summary><pre>${esc(JSON.stringify(t.report.evidence, null, 2))}</pre></details><button class="download" data-task="${esc(t.id)}" style="margin-top:15px">下载分析报告</button>`;
        }
        if (t.context)
          html += `<details><summary>上下文聚合、路由和短期记忆</summary><pre>${esc(JSON.stringify({ context: t.context, routing: t.routing }, null, 2))}</pre></details>`;
        if (t.artifact_id)
          html += `<button class="save-result" data-artifact="${esc(t.artifact_id)}" style="margin-top:15px">收藏此结果</button>`;
        if (t.retrieval)
          html += `<details><summary>元数据检索与依赖补全（${esc(t.retrieval.embedding_mode)}）</summary><pre>${esc(JSON.stringify(t.retrieval, null, 2))}</pre></details>`;
        html += "</div>";
        $("output").insertAdjacentHTML("afterbegin", html);
      }
      // 等待澄清时调用恢复接口，否则提交新的问题。
      $("send").onclick = async () => {
        if (busy) return;
        const question = $("question").value.trim();
        if (!question) return;
        busy = true;
        $("send").disabled = true;
        $("new").disabled = true;
        $("status").textContent = "正在检索、查询和分析…";
        try {
          const body = pending
            ? {
                answer: question,
                expected_version: pending.version,
                request_id: crypto.randomUUID(),
              }
            : {
                question,
                session_id: session,
                request_id: crypto.randomUUID(),
                memory_ids: [...selectedMemories],
              };
          const t = await api(
            pending ? `/api/tasks/${pending.id}/resume` : "/api/ask",
            body,
          );
          render(t);
          $("question").value = "";
          $("status").textContent = t.state;
        } catch (e) {
          $("status").textContent = e.message;
        } finally {
          busy = false;
          $("send").disabled = false;
          $("new").disabled = false;
        }
      };
      $("new").onclick = () => {
        session = null;
        pending = null;
        sessionStorage.removeItem("data-agent-last-task");
        $("output").replaceChildren();
        $("prompt-title").textContent = "向数据提问";
        $("status").textContent = "新会话";
      };
      document.querySelectorAll(".examples button").forEach(
        (b) =>
          (b.onclick = () => {
            $("question").value = b.textContent;
          }),
      );
      $("output").onclick = async (e) => {
        if (e.target.className === "save-result") {
          try {
            await api("/api/memories", {
              kind: "result",
              source_id: e.target.dataset.artifact,
              title: "分析结果 " + new Date().toLocaleString(),
            });
            await loadMemories();
            $("status").textContent = "结果已保存；勾选后可跨会话使用";
          } catch (err) {
            $("status").textContent = err.message;
          }
          return;
        }
        if (e.target.className !== "download") return;
        const r = await fetch(`/api/tasks/${e.target.dataset.task}/report`, {
          headers: $("token").value
            ? { Authorization: "Bearer " + $("token").value }
            : {},
        });
        if (!r.ok) {
          $("status").textContent = "报告下载失败";
          return;
        }
        const u = URL.createObjectURL(await r.blob());
        const a = document.createElement("a");
        a.href = u;
        a.download = "data-agent-report.md";
        a.click();
        URL.revokeObjectURL(u);
      };
      api("/api/health")
        .then((h) => {
          $("mode").textContent =
            (h.mode === "offline" ? "规则解析" : "模型解析") +
            " · " +
            (h.embedding === "local"
              ? "本地语义检索"
              : h.embedding === "remote"
                ? "远程语义检索"
                : "词法测试检索");
        })
        .catch((e) => ($("mode").textContent = e.message));
      async function catalog() {
        try {
          const c = await api("/api/catalog");
          $("catalog").innerHTML = Object.values(c.metrics)
            .map(
              (m) => `<p><strong>${esc(m.name)}</strong><br>${esc(m.rule)}</p>`,
            )
            .join("");
        } catch (e) {
          $("catalog").textContent = "填写有效令牌后可查看";
        }
      }
      async function restore() {
        const id = sessionStorage.getItem("data-agent-last-task");
        if (!id) return;
        try {
          const t = await api("/api/tasks/" + encodeURIComponent(id));
          $("output").replaceChildren();
          render(t);
          $("status").textContent = "已恢复当前会话";
        } catch (e) {
          $("status").textContent = "会话未恢复，请检查服务或访问令牌";
        }
      }
      catalog();
      restore();
      loadMemories();
      $("token").onchange = () => {
        catalog();
        restore();
        loadMemories();
      };
      // 长期记忆列表：展示后端保存的条目，并保留当前勾选状态。
      async function loadMemories() {
        try {
          const data = await api(
            "/api/memories?q=" + encodeURIComponent($("memory-search").value),
          );
          $("memories").innerHTML =
            data.items
              .map(
                (m) =>
                  `<p><label><input type="checkbox" style="width:auto" data-memory="${esc(m.id)}" ${selectedMemories.has(m.id) ? "checked" : ""}> ${esc(m.title)}</label><br><span class="muted">${esc(m.kind)} · ${esc(m.source_id)}<br>${esc(m.note)}</span> <button data-delete="${esc(m.id)}" style="padding:3px 6px">删除</button></p>`,
              )
              .join("") || '<p class="muted">没有匹配的已保存记忆</p>';
        } catch (e) {
          $("memories").textContent = e.message;
        }
      }
      $("save-schema").onclick = async () => {
        try {
          await api("/api/memories", {
            kind: $("memory-kind").value,
            source_id: $("memory-source").value.trim(),
            note: $("memory-note").value,
          });
          await loadMemories();
          $("status").textContent = "记忆已保存";
        } catch (e) {
          $("status").textContent = e.message;
        }
      };
      $("memory-search").oninput = loadMemories;
      $("memories").onchange = (e) => {
        const id = e.target.dataset.memory;
        if (id) {
          if (e.target.checked) selectedMemories.add(id);
          else selectedMemories.delete(id);
        }
      };
      $("memories").onclick = async (e) => {
        const id = e.target.dataset.delete;
        if (!id) return;
        try {
          await api("/api/memories/" + encodeURIComponent(id), null, "DELETE");
          selectedMemories.delete(id);
          await loadMemories();
        } catch (err) {
          $("status").textContent = err.message;
        }
      };
    </script>
  </body>
</html>
